# 图书管理系统配置文件

spring:
  application:
    name: library-admin
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 Knife4j
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    timeout: 2592000  # 30 天过期
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 服务器配置
server:
  address: 0.0.0.0
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000  # cookie 30 天过期

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "图书管理系统接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.libraryadminbackend.controller
